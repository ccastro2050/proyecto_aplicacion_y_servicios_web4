# ==============================================================
# Proyecto Aplicación y Servicios Web — versión 4:
# api_facturas (C#/ASP.NET Core) + DOS motores con la misma BD
#
#                                 ┌→ SQL Server (bdfacturas, :11466)
#   Navegador → API (C#, :8035) ─┤      el interruptor MOTOR_BD
#                                 └→ PostgreSQL (bdfacturas, :15462)
#
# Uso: docker compose up -d --build     (UN solo comando)
#   La API habla con PostgreSQL por defecto; para cambiar de motor
#   SIN tocar código:  $env:MOTOR_BD="sqlserver"
#                      docker compose up -d api-facturas
# Reset de las BD: docker compose down -v && docker compose up -d
#
# Este archivo CRECE por versiones: v5 sumará MariaDB,
# v6 la API genérica, v7 el front Blazor.
# ==============================================================
services:

  # --- SQL Server 2022 (requiere ~2 GB de RAM) ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"                       # aceptar la licencia (obligatorio)
      MSSQL_SA_PASSWORD: "Paradigmas123!"    # clave del superusuario 'sa'
      MSSQL_PID: Developer                   # edición gratuita para desarrollo
    volumes:
      - mssqldata:/var/opt/mssql             # los datos sobreviven a `down`
    ports:
      - "11466:1433"     # puerto en su PC (para SQLTools/SSMS opcional)
    healthcheck:
      # ¿La BD ya RESPONDE consultas? (no solo "el contenedor existe")
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s    # margen de gracia: SQL Server tarda en arrancar

  # --- Inicializador (crea bdfacturas la primera vez y termina) ---
  # SQL Server NO ejecuta scripts montados automáticamente (a diferencia
  # de otros motores): este contenedor se conecta, corre db/init.sh UNA
  # vez, y muere. Si la BD ya existe, no hace nada.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy     # espera a que el motor RESPONDA
    environment:
      MSSQL_SA_PASSWORD: "Paradigmas123!"
    volumes:
      - ./db:/scripts:ro               # init.sh y bdfacturas.sql, solo lectura
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"                      # corre una vez; no revive

  # --- PostgreSQL 16 — el SEGUNDO motor (v4) ---
  # El contraste didáctico con sqlserver-init: PostgreSQL SÍ ejecuta
  # los scripts montados en /docker-entrypoint-initdb.d/ la primera
  # vez (volumen vacío) — no necesita contenedor inicializador.
  postgres:
    image: postgres:16-alpine                # ~50 MB (SQL Server pide ~2 GB)
    environment:
      POSTGRES_PASSWORD: "Paradigmas123!"    # clave del superusuario 'postgres'
      POSTGRES_DB: bdfacturas_postgres_local # la BD que crea al nacer
    volumes:
      - pgdata:/var/lib/postgresql/data      # los datos sobreviven a `down`
      - ./db/bdfacturas_postgres.sql:/docker-entrypoint-initdb.d/bdfacturas_postgres.sql:ro
    ports:
      - "15462:5432"     # puerto en su PC (para psql/pgAdmin opcional)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdfacturas_postgres_local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- API Facturas — C# / ASP.NET Core ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app      # el código montado: guardar un .cs recompila solo
      - /app/bin                 # bin y obj quedan DENTRO del contenedor (Linux),
      - /app/obj                 #   sin mezclarse con los compilados de Windows
    restart: unless-stopped
    ports:
      - "8035:8035"              # http://localhost:8035
    environment:
      # La cadena usa el NOMBRE del servicio como host (sqlserver,1433),
      # no localhost: dentro de la red interna de compose los servicios
      # se resuelven por nombre. Esta variable SOBREESCRIBE el valor de
      # appsettings.json (ASP.NET lee "ConnectionStrings__X" así).
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=bdfacturas_sqlserver_local;User Id=sa;Password=Paradigmas123!;TrustServerCertificate=True;"
      # v4 — la cadena del SEGUNDO motor (host interno postgres:5432):
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=bdfacturas_postgres_local;Username=postgres;Password=Paradigmas123!"
      # v4 — EL INTERRUPTOR: a qué motor le habla la API. Lee la
      # variable MOTOR_BD de su terminal; si no existe, postgres.
      # Cambiar de motor = recrear SOLO este contenedor (segundos):
      #   $env:MOTOR_BD="sqlserver"; docker compose up -d api-facturas
      Motor: ${MOTOR_BD:-postgres}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
        # ↑ la API arranca cuando el inicializador TERMINÓ BIEN:
        #   la BD ya existe con sus 12 tablas y datos.
      postgres:
        condition: service_healthy
        # ↑ …y cuando el motor nuevo ya responde (él se inicializa solo).

volumes:
  mssqldata:      # declaración del volumen nombrado (la "memoria" de la BD)
  pgdata:         # v4: la "memoria" del segundo motor
