<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 586" width="980" height="586" font-family="Segoe UI, system-ui, sans-serif">
  <title>401 y 403: dos puertas distintas</title>
  <desc>El 401 dice no sé quién es usted; el 403 dice sé quién es y no puede. Dos comprobaciones en orden, y el permiso se consulta en la base en cada petición.</desc>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#17495B"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#F4F2EC"/>

  <text x="36" y="42" font-size="21" font-weight="600" fill="#17495B">401 y 403 son dos puertas, no dos nombres del mismo error</text>
  <text x="36" y="66" font-size="14" fill="#4A4A4A">El 401 dice «no sé quién es usted». El 403 dice «sé quién es, y no puede».</text>
  <text x="36" y="85" font-size="14" fill="#4A4A4A">Confundirlos manda a la persona a arreglar lo que no está roto.</text>

  <!-- peticion -->
  <rect x="36" y="126" width="200" height="64" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="136" y="152" font-size="13" font-weight="600" text-anchor="middle" fill="#17495B">La petición llega</text>
  <text x="136" y="172" font-size="11" text-anchor="middle" fill="#4A4A4A">GET /api/factura</text>

  <!-- puerta 1 -->
  <rect x="290" y="116" width="230" height="84" rx="8" fill="#fff" stroke="#17495B" stroke-width="2.5"/>
  <text x="405" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#17495B">PUERTA 1 · [Authorize]</text>
  <text x="405" y="164" font-size="11.5" text-anchor="middle" fill="#4A4A4A">¿Trae un token firmado</text>
  <text x="405" y="181" font-size="11.5" text-anchor="middle" fill="#4A4A4A">por esta API y sin vencer?</text>
  <line x1="240" y1="158" x2="286" y2="158" stroke="#17495B" stroke-width="2" marker-end="url(#a3)"/>

  <!-- puerta 2 -->
  <rect x="574" y="116" width="230" height="84" rx="8" fill="#fff" stroke="#17495B" stroke-width="2.5"/>
  <text x="689" y="142" font-size="14" font-weight="600" text-anchor="middle" fill="#17495B">PUERTA 2 · [ExigePermiso]</text>
  <text x="689" y="164" font-size="11.5" text-anchor="middle" fill="#4A4A4A">¿Alguno de sus roles tiene</text>
  <text x="689" y="181" font-size="11.5" text-anchor="middle" fill="#4A4A4A">esta ruta concedida?</text>
  <line x1="524" y1="158" x2="570" y2="158" stroke="#2F7D5C" stroke-width="2" marker-end="url(#a3)"/>
  <text x="547" y="150" font-size="10" text-anchor="middle" fill="#2F7D5C">sí</text>

  <!-- pasa -->
  <rect x="846" y="126" width="98" height="64" rx="8" fill="#2F7D5C"/>
  <text x="895" y="154" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">200</text>
  <text x="895" y="174" font-size="11" text-anchor="middle" fill="#F4F2EC">entra</text>
  <line x1="808" y1="158" x2="842" y2="158" stroke="#2F7D5C" stroke-width="2" marker-end="url(#a3)"/>

  <!-- 401 -->
  <rect x="290" y="252" width="230" height="110" rx="8" fill="#B4402F"/>
  <text x="405" y="280" font-size="17" font-weight="600" text-anchor="middle" fill="#fff">401</text>
  <text x="405" y="302" font-size="12" text-anchor="middle" fill="#fff">«No sé quién es usted»</text>
  <text x="405" y="326" font-size="11" text-anchor="middle" fill="#F4F2EC">Sin token, alterado o vencido.</text>
  <text x="405" y="344" font-size="11" text-anchor="middle" fill="#F4F2EC">Qué hace la persona: identificarse.</text>
  <line x1="405" y1="204" x2="405" y2="248" stroke="#B4402F" stroke-width="2" marker-end="url(#a3)"/>
  <text x="430" y="228" font-size="10" fill="#B4402F">no</text>

  <!-- 403 -->
  <rect x="574" y="252" width="230" height="110" rx="8" fill="#E39B2D"/>
  <text x="689" y="280" font-size="17" font-weight="600" text-anchor="middle" fill="#fff">403</text>
  <text x="689" y="302" font-size="12" text-anchor="middle" fill="#fff">«Sé quién es, y no puede»</text>
  <text x="689" y="326" font-size="11" text-anchor="middle" fill="#fff">El token es bueno; el permiso no está.</text>
  <text x="689" y="344" font-size="11" text-anchor="middle" fill="#fff">Qué hace: pedírselo al administrador.</text>
  <line x1="689" y1="204" x2="689" y2="248" stroke="#E39B2D" stroke-width="2" marker-end="url(#a3)"/>
  <text x="714" y="228" font-size="10" fill="#E39B2D">no</text>

  <!-- el permiso sale de la base -->
  <rect x="36" y="400" width="908" height="76" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="56" y="424" font-size="13" font-weight="600" fill="#17495B">El permiso NO sale del token: se consulta en la base, en cada petición</text>
  <text x="56" y="446" font-size="12" fill="#4A4A4A">`verificar_acceso_ruta` cruza los roles de la persona con la tabla `rutarol`. Por eso quitarle un permiso a un rol surte efecto YA,</text>
  <text x="56" y="465" font-size="12" fill="#4A4A4A">sin que nadie tenga que volver a identificarse. Si el permiso viajara dentro del token, habría que esperar a que venza.</text>

  <!-- el error tipico -->
  <rect x="36" y="496" width="908" height="76" rx="8" fill="#fff" stroke="#B4402F" stroke-width="2"/>
  <text x="56" y="519" font-size="12.5" font-weight="600" fill="#B4402F">El error que hay que no cometer</text>
  <text x="56" y="538" font-size="12" fill="#4A4A4A">Esconder un botón del menú NO es control de acceso: el menú es HTML que ya está en el navegador de quien pregunta,</text>
  <text x="56" y="556" font-size="12" fill="#4A4A4A">y la dirección se escribe a mano. La puerta va en el controlador.</text>
</svg>
