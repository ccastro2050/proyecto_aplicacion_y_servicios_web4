<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" font-family="Segoe UI, system-ui, sans-serif">
  <title>El recorrido de una petición: del navegador a la base y de vuelta</title>
  <desc>GET /api/factura/3 entra por el front, cruza controlador, servicio y repositorio, llega a SQL Server y vuelve convertida en pantalla. Cada capa solo habla con su vecina.</desc>

  <defs>
    <marker id="f" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#17495B"/>
    </marker>
    <marker id="fv" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2F7D5C"/>
    </marker>
  </defs>

  <rect width="980" height="570" fill="#F4F2EC"/>

  <text x="36" y="42" font-size="21" font-weight="600" fill="#17495B">El recorrido de UNA petición</text>
  <text x="36" y="66" font-size="14" fill="#4A4A4A">Cada capa habla SOLO con su vecina. Ninguna se salta a la siguiente — y por eso se pueden cambiar de a una.</text>

  <!-- ================= IDA ================= -->
  <text x="36" y="100" font-size="12" font-weight="600" fill="#17495B">IDA · la pregunta baja</text>

  <!-- navegador -->
  <rect x="36" y="118" width="150" height="62" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="111" y="143" font-size="13" font-weight="600" text-anchor="middle" fill="#17495B">Navegador</text>
  <text x="111" y="162" font-size="11" text-anchor="middle" fill="#4A4A4A">la persona hace clic</text>

  <!-- front -->
  <rect x="222" y="118" width="150" height="62" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="297" y="143" font-size="13" font-weight="600" text-anchor="middle" fill="#17495B">Front (Blazor)</text>
  <text x="297" y="162" font-size="11" text-anchor="middle" fill="#4A4A4A">ServicioFactura</text>

  <!-- controlador -->
  <rect x="408" y="118" width="150" height="62" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="483" y="143" font-size="13" font-weight="600" text-anchor="middle" fill="#17495B">Controlador</text>
  <text x="483" y="162" font-size="11" text-anchor="middle" fill="#4A4A4A">solo HTTP</text>

  <!-- servicio -->
  <rect x="594" y="118" width="150" height="62" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="669" y="143" font-size="13" font-weight="600" text-anchor="middle" fill="#17495B">Servicio</text>
  <text x="669" y="162" font-size="11" text-anchor="middle" fill="#4A4A4A">las reglas</text>

  <!-- repositorio -->
  <rect x="780" y="118" width="150" height="62" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="855" y="143" font-size="13" font-weight="600" text-anchor="middle" fill="#17495B">Repositorio</text>
  <text x="855" y="162" font-size="11" text-anchor="middle" fill="#4A4A4A">el SQL</text>

  <!-- flechas de ida -->
  <line x1="188" y1="149" x2="218" y2="149" stroke="#17495B" stroke-width="2" marker-end="url(#f)"/>
  <line x1="374" y1="149" x2="404" y2="149" stroke="#17495B" stroke-width="2" marker-end="url(#f)"/>
  <line x1="560" y1="149" x2="590" y2="149" stroke="#17495B" stroke-width="2" marker-end="url(#f)"/>
  <line x1="746" y1="149" x2="776" y2="149" stroke="#17495B" stroke-width="2" marker-end="url(#f)"/>

  <text x="203" y="140" font-size="10" text-anchor="middle" fill="#4A4A4A">clic</text>
  <text x="389" y="140" font-size="10" text-anchor="middle" fill="#4A4A4A">HTTP</text>


  <!-- la frontera de proceso: una llave bajo los tres de la API -->
  <path d="M408 190 L408 198 L930 198 L930 190" fill="none" stroke="#4A4A4A" stroke-width="1"/>
  <text x="669" y="214" font-size="11" text-anchor="middle" fill="#4A4A4A">un solo proceso: de aquí en adelante son llamadas en memoria, no red</text>

  <!-- la peticion -->
  <rect x="222" y="228" width="336" height="30" rx="6" fill="#17495B"/>
  <text x="238" y="248" font-size="13" font-family="Consolas, monospace" fill="#fff">GET /api/factura/3</text>

  <!-- base de datos -->
  <rect x="780" y="252" width="150" height="74" rx="8" fill="#17495B"/>
  <text x="855" y="278" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">SQL Server</text>
  <text x="855" y="296" font-size="11" text-anchor="middle" fill="#F4F2EC">sp_consultar_...</text>
  <text x="855" y="313" font-size="11" text-anchor="middle" fill="#F4F2EC">el trigger calcula</text>
  <line x1="855" y1="204" x2="855" y2="248" stroke="#17495B" stroke-width="2" marker-end="url(#f)"/>

  <!-- ================= VUELTA ================= -->
  <text x="36" y="346" font-size="12" font-weight="600" fill="#2F7D5C">VUELTA · la respuesta sube</text>
  <text x="36" y="364" font-size="11" fill="#4A4A4A">y en cada capa</text>
  <text x="36" y="379" font-size="11" fill="#4A4A4A">CAMBIA DE FORMA</text>

  <line x1="776" y1="362" x2="746" y2="362" stroke="#2F7D5C" stroke-width="2" marker-end="url(#fv)"/>
  <line x1="590" y1="362" x2="560" y2="362" stroke="#2F7D5C" stroke-width="2" marker-end="url(#fv)"/>
  <line x1="404" y1="362" x2="374" y2="362" stroke="#2F7D5C" stroke-width="2" marker-end="url(#fv)"/>
  <line x1="218" y1="362" x2="188" y2="362" stroke="#2F7D5C" stroke-width="2" marker-end="url(#fv)"/>
  <line x1="855" y1="330" x2="855" y2="356" stroke="#2F7D5C" stroke-width="2"/>
  <line x1="855" y1="356" x2="860" y2="362" stroke="#2F7D5C" stroke-width="2"/>

  <rect x="780" y="390" width="150" height="56" rx="6" fill="#fff" stroke="#2F7D5C" stroke-width="1.5"/>
  <text x="855" y="411" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">filas</text>
  <text x="855" y="430" font-size="10" text-anchor="middle" fill="#4A4A4A">lo que devuelve el SP</text>

  <rect x="594" y="390" width="150" height="56" rx="6" fill="#fff" stroke="#2F7D5C" stroke-width="1.5"/>
  <text x="669" y="411" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">objetos Factura</text>
  <text x="669" y="430" font-size="10" text-anchor="middle" fill="#4A4A4A">con su detalle adentro</text>

  <rect x="408" y="390" width="150" height="56" rx="6" fill="#fff" stroke="#2F7D5C" stroke-width="1.5"/>
  <text x="483" y="411" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">200 + JSON</text>
  <text x="483" y="430" font-size="10" text-anchor="middle" fill="#4A4A4A">o 404 si no existe</text>

  <rect x="222" y="390" width="150" height="56" rx="6" fill="#fff" stroke="#2F7D5C" stroke-width="1.5"/>
  <text x="297" y="411" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">Resultado&lt;T&gt;</text>
  <text x="297" y="430" font-size="10" text-anchor="middle" fill="#4A4A4A">ok + datos o errores</text>

  <rect x="36" y="390" width="150" height="56" rx="6" fill="#fff" stroke="#2F7D5C" stroke-width="1.5"/>
  <text x="111" y="411" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">pantalla</text>
  <text x="111" y="430" font-size="10" text-anchor="middle" fill="#4A4A4A">una tabla, en castellano</text>

  <!-- la leccion -->
  <rect x="36" y="474" width="894" height="66" rx="8" fill="#fff" stroke="#E39B2D" stroke-width="2"/>
  <text x="54" y="496" font-size="12" font-weight="600" fill="#B4402F">Lo que NUNCA pasa</text>
  <text x="54" y="514" font-size="12" fill="#4A4A4A">El front no abre una conexión a la base. El controlador no escribe SQL. El servicio no sabe qué es un 404.</text>
  <text x="54" y="531" font-size="12" fill="#4A4A4A">Si una capa se salta a la siguiente, la separación es un dibujo y no una arquitectura.</text>
</svg>
