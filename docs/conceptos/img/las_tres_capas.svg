<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Segoe UI, system-ui, sans-serif">
  <title>Las tres capas y por qué dependen de interfaces</title>
  <desc>Controlador, servicio y repositorio. Cada uno depende de la INTERFAZ del siguiente, no de la clase. Por eso se puede cambiar SQL Server por PostgreSQL sin tocar nada de arriba.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#17495B"/>
    </marker>
    <marker id="hueca" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#F4F2EC" stroke="#4A4A4A" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#F4F2EC"/>

  <text x="36" y="42" font-size="21" font-weight="600" fill="#17495B">Las tres capas, y por qué cada una depende de una INTERFAZ</text>
  <text x="36" y="66" font-size="14" fill="#4A4A4A">La flecha llena es «usa». La flecha de punta hueca es «implementa». Lo que se usa es siempre la interfaz.</text>

  <!-- CONTROLADOR -->
  <rect x="60" y="100" width="300" height="78" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="210" y="126" font-size="15" font-weight="600" text-anchor="middle" fill="#17495B">FacturaController</text>
  <text x="210" y="147" font-size="12" text-anchor="middle" fill="#4A4A4A">lee la petición · responde JSON</text>
  <text x="210" y="166" font-size="12" text-anchor="middle" fill="#B4402F">no sabe qué es una tabla</text>

  <!-- interfaz servicio -->
  <rect x="470" y="110" width="250" height="58" rx="8" fill="#F4F2EC" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="595" y="134" font-size="14" font-weight="600" text-anchor="middle" fill="#4A4A4A">IServicioFactura</text>
  <text x="595" y="154" font-size="11" text-anchor="middle" fill="#4A4A4A">qué se puede hacer, no cómo</text>
  <line x1="364" y1="139" x2="466" y2="139" stroke="#17495B" stroke-width="2" marker-end="url(#a)"/>
  <text x="415" y="131" font-size="10" text-anchor="middle" fill="#17495B">usa</text>

  <!-- SERVICIO -->
  <rect x="60" y="235" width="300" height="78" rx="8" fill="#fff" stroke="#2F7D5C" stroke-width="2"/>
  <text x="210" y="261" font-size="15" font-weight="600" text-anchor="middle" fill="#2F7D5C">ServicioFactura</text>
  <text x="210" y="282" font-size="12" text-anchor="middle" fill="#4A4A4A">las reglas del negocio</text>
  <text x="210" y="301" font-size="12" text-anchor="middle" fill="#B4402F">no sabe qué es un 404</text>
  <line x1="595" y1="172" x2="595" y2="212" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="595" y1="212" x2="368" y2="212" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="368" y1="212" x2="368" y2="248" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hueca)"/>
  <text x="480" y="206" font-size="10" text-anchor="middle" fill="#4A4A4A">implementa</text>

  <!-- interfaz repositorio -->
  <rect x="470" y="245" width="250" height="58" rx="8" fill="#F4F2EC" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="595" y="269" font-size="14" font-weight="600" text-anchor="middle" fill="#4A4A4A">IRepositorioFactura</text>
  <text x="595" y="289" font-size="11" text-anchor="middle" fill="#4A4A4A">listar · consultar · crear · anular</text>
  <line x1="364" y1="274" x2="466" y2="274" stroke="#2F7D5C" stroke-width="2" marker-end="url(#a)"/>
  <text x="415" y="266" font-size="10" text-anchor="middle" fill="#2F7D5C">usa</text>

  <!-- DOS REPOSITORIOS -->
  <rect x="60" y="370" width="300" height="70" rx="8" fill="#fff" stroke="#E39B2D" stroke-width="2"/>
  <text x="210" y="396" font-size="14" font-weight="600" text-anchor="middle" fill="#E39B2D">RepositorioFacturaSqlServer</text>
  <text x="210" y="418" font-size="12" text-anchor="middle" fill="#4A4A4A">CommandType.StoredProcedure</text>

  <rect x="420" y="370" width="300" height="70" rx="8" fill="#fff" stroke="#E39B2D" stroke-width="2"/>
  <text x="570" y="396" font-size="14" font-weight="600" text-anchor="middle" fill="#E39B2D">RepositorioFacturaPostgres</text>
  <text x="570" y="418" font-size="12" text-anchor="middle" fill="#4A4A4A">CALL sp_...(@p, NULL)</text>

  <line x1="595" y1="307" x2="595" y2="330" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="210" y1="330" x2="570" y2="330" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="210" y1="330" x2="210" y2="364" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hueca)"/>
  <line x1="570" y1="330" x2="570" y2="364" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hueca)"/>
  <text x="330" y="324" font-size="10" text-anchor="middle" fill="#4A4A4A">implementan LA MISMA interfaz</text>

  <!-- la fabrica -->
  <rect x="780" y="370" width="160" height="70" rx="8" fill="#17495B"/>
  <text x="860" y="396" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">La fábrica</text>
  <text x="860" y="416" font-size="11" text-anchor="middle" fill="#F4F2EC">elige uno por</text>
  <text x="860" y="431" font-size="11" text-anchor="middle" fill="#F4F2EC">configuración</text>
  <line x1="776" y1="405" x2="726" y2="405" stroke="#17495B" stroke-width="2" marker-end="url(#a)"/>

  <!-- la leccion -->
  <rect x="60" y="476" width="880" height="94" rx="8" fill="#fff" stroke="#E39B2D" stroke-width="2"/>
  <text x="80" y="500" font-size="13" font-weight="600" fill="#17495B">Para qué sirve todo esto, en una frase que se puede comprobar</text>
  <text x="80" y="522" font-size="12.5" fill="#4A4A4A">Cambiar SQL Server por PostgreSQL es escribir una clase nueva y una línea en la fábrica.</text>
  <text x="80" y="541" font-size="12.5" fill="#4A4A4A">El controlador y el servicio NO SE TOCAN — y eso se prueba con un `diff`, no con una promesa.</text>
  <text x="80" y="560" font-size="12" fill="#B4402F">Si al cambiar el motor hay que tocar el controlador, las capas estaban mal hechas.</text>
</svg>
