<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 566" width="980" height="566" font-family="Segoe UI, system-ui, sans-serif">
  <title>Un repositorio no es una unidad de despliegue</title>
  <desc>El repositorio dice como se guarda el codigo; la arquitectura dice como se ejecuta. Tener todo junto se llama monorepo, no monolito. Aqui un repositorio contiene DOS unidades desplegables.</desc>
  <rect width="980" height="566" fill="#F4F2EC"/>

  <text x="36" y="42" font-size="21" font-weight="600" fill="#17495B">Un repositorio NO es una unidad de despliegue</text>
  <text x="36" y="66" font-size="14" fill="#4A4A4A">Es la confusion de la que sale «como todo esta en un repositorio, esto es un monolito».</text>

  <!-- ======= EL REPOSITORIO: caja punteada que abarca ======= -->
  <rect x="36" y="94" width="520" height="286" rx="10" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="54" y="120" font-size="14" font-weight="600" fill="#4A4A4A">EL REPOSITORIO — como se GUARDA</text>
  <text x="54" y="140" font-size="12" fill="#4A4A4A">un solo repositorio en GitHub  ·  esto se llama MONOREPO</text>

  <!-- unidad 1 -->
  <rect x="58" y="158" width="222" height="96" rx="8" fill="#fff" stroke="#17495B" stroke-width="2.5"/>
  <text x="169" y="184" font-size="13.5" font-weight="600" text-anchor="middle" fill="#17495B">api_facturas/</text>
  <text x="169" y="206" font-size="11.5" text-anchor="middle" fill="#4A4A4A">15 controladores · 3 capas</text>
  <text x="169" y="226" font-size="11.5" text-anchor="middle" fill="#4A4A4A">un .csproj</text>
  <text x="169" y="245" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">ES UN MONOLITO</text>

  <!-- unidad 2 -->
  <rect x="312" y="158" width="222" height="96" rx="8" fill="#fff" stroke="#17495B" stroke-width="2.5"/>
  <text x="423" y="184" font-size="13.5" font-weight="600" text-anchor="middle" fill="#17495B">front_blazor/</text>
  <text x="423" y="206" font-size="11.5" text-anchor="middle" fill="#4A4A4A">15 pantallas</text>
  <text x="423" y="226" font-size="11.5" text-anchor="middle" fill="#4A4A4A">un .csproj</text>
  <text x="423" y="245" font-size="11" font-weight="600" text-anchor="middle" fill="#2F7D5C">ES UN MONOLITO</text>

  <!-- el resto -->
  <rect x="58" y="268" width="476" height="40" rx="6" fill="#F4F2EC" stroke="#b9c6cc" stroke-width="1.5"/>
  <text x="296" y="293" font-size="11.5" text-anchor="middle" fill="#4A4A4A">db/  ·  docs/  ·  docker-compose.yml  —  no se despliegan: describen y siembran</text>

  <text x="54" y="336" font-size="12.5" font-weight="600" fill="#4A4A4A">DOS unidades desplegables dentro de UN repositorio.</text>
  <text x="54" y="358" font-size="12.5" fill="#4A4A4A">Por eso el repositorio no dice nada sobre la arquitectura.</text>

  <!-- ======= LAS DOS DIMENSIONES ======= -->
  <rect x="596" y="94" width="348" height="286" rx="10" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="616" y="120" font-size="14" font-weight="600" fill="#17495B">SON DOS DIMENSIONES DISTINTAS</text>

  <rect x="616" y="138" width="308" height="66" rx="6" fill="#F4F2EC"/>
  <text x="632" y="160" font-size="12.5" font-weight="600" fill="#4A4A4A">MONOREPO</text>
  <text x="632" y="180" font-size="11.5" fill="#4A4A4A">cuantos REPOSITORIOS hay</text>
  <text x="632" y="197" font-size="11.5" fill="#4A4A4A">aqui: uno</text>

  <rect x="616" y="216" width="308" height="66" rx="6" fill="#F4F2EC"/>
  <text x="632" y="238" font-size="12.5" font-weight="600" fill="#4A4A4A">MONOLITO</text>
  <text x="632" y="258" font-size="11.5" fill="#4A4A4A">cuantas UNIDADES DESPLEGABLES</text>
  <text x="632" y="275" font-size="11.5" fill="#4A4A4A">aqui: dos — por eso el sistema no lo es</text>

  <text x="616" y="312" font-size="12" fill="#4A4A4A">Y se combinan como quieran:</text>
  <text x="630" y="334" font-size="11.5" fill="#4A4A4A">· un monorepo CON microservicios — existe</text>
  <text x="630" y="354" font-size="11.5" fill="#4A4A4A">· veinte repos que al desplegarse son UN proceso</text>

  <!-- ======= LA TABLA DE LAS TRES PALABRAS ======= -->
  <rect x="36" y="398" width="908" height="60" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="56" y="422" font-size="13" font-weight="600" fill="#17495B">Las tres palabras, y cual aplica en este sistema:</text>
  <text x="56" y="444" font-size="12.5" fill="#4A4A4A">MONOLITO la API si, el front si, el sistema NO   ·   MONOREPO si   ·   MICROSERVICIOS no: falta base propia, descubrimiento y colas</text>

  <!-- ======= CIERRE ======= -->
  <rect x="36" y="472" width="908" height="70" rx="8" fill="#17495B"/>
  <text x="60" y="500" font-size="14.5" font-weight="600" fill="#fff">«Monolito» se predica de UNA UNIDAD DESPLEGABLE — no de un repositorio.</text>
  <text x="60" y="526" font-size="13" fill="#E39B2D">Y no es un insulto: casi todo software empieza siendo uno, y para este tamaño es la decision correcta.</text>
</svg>
