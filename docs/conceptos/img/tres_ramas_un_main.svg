<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tres ramas, un main, y un tag por version</title>
  <desc>El flujo que el aula exige: nadie trabaja en main, cada estudiante tiene su rama, todo entra por Pull Request, solo el integrador fusiona, y cada version cierra con un tag.</desc>
  <defs>
    <marker id="pr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2F7D5C"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#F4F2EC"/>

  <text x="36" y="42" font-size="21" font-weight="600" fill="#17495B">Tres ramas, un main, y un tag por version</text>
  <text x="36" y="66" font-size="14" fill="#4A4A4A">Es el flujo que la metodologia exige desde la v1, y se califica: cada estudiante responde por SU rama.</text>

  <!-- ===== VERSION 1 ===== -->
  <text x="36" y="104" font-size="13" font-weight="600" fill="#17495B">VERSION 1</text>

  <!-- rama carlos -->
  <text x="36" y="140" font-size="12" font-weight="600" fill="#4A4A4A">rama-carlos</text>
  <line x1="150" y1="135" x2="330" y2="135" stroke="#17495B" stroke-width="2"/>
  <circle cx="178" cy="135" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="232" cy="135" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="286" cy="135" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <path d="M330 135 Q 372 135 386 212" fill="none" stroke="#2F7D5C" stroke-width="2.5" marker-end="url(#pr)"/>
  <text x="346" y="128" font-size="11" font-weight="600" fill="#2F7D5C">PR</text>

  <!-- rama paco -->
  <text x="36" y="180" font-size="12" font-weight="600" fill="#4A4A4A">rama-paco</text>
  <line x1="150" y1="175" x2="310" y2="175" stroke="#17495B" stroke-width="2"/>
  <circle cx="186" cy="175" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="248" cy="175" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <path d="M310 175 Q 364 175 384 212" fill="none" stroke="#2F7D5C" stroke-width="2.5" marker-end="url(#pr)"/>
  <text x="330" y="168" font-size="11" font-weight="600" fill="#2F7D5C">PR</text>

  <!-- rama luis -->
  <text x="36" y="248" font-size="12" font-weight="600" fill="#4A4A4A">rama-luis</text>
  <line x1="150" y1="243" x2="320" y2="243" stroke="#17495B" stroke-width="2"/>
  <circle cx="180" cy="243" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="234" cy="243" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="288" cy="243" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <path d="M320 243 Q 368 243 384 224" fill="none" stroke="#2F7D5C" stroke-width="2.5" marker-end="url(#pr)"/>
  <text x="338" y="262" font-size="11" font-weight="600" fill="#2F7D5C">PR</text>

  <!-- main -->
  <text x="36" y="214" font-size="12.5" font-weight="600" fill="#17495B">main</text>
  <line x1="150" y1="209" x2="150" y2="209" stroke="#17495B" stroke-width="3"/>
  <line x1="130" y1="209" x2="872" y2="209" stroke="#17495B" stroke-width="3"/>
  <circle cx="150" cy="209" r="9" fill="#17495B"/>
  <circle cx="398" cy="209" r="9" fill="#17495B"/>
  <text x="398" y="262" font-size="10.5" text-anchor="middle" fill="#4A4A4A">fusion</text>

  <!-- tag v1 -->
  <rect x="424" y="194" width="58" height="30" rx="5" fill="#E39B2D"/>
  <text x="453" y="214" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4A4A4A">v1</text>

  <!-- ===== VERSION 2 ===== -->
  <text x="520" y="104" font-size="13" font-weight="600" fill="#17495B">VERSION 2 — y se repite igual</text>
  <line x1="560" y1="135" x2="700" y2="135" stroke="#17495B" stroke-width="2"/>
  <circle cx="584" cy="135" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="636" cy="135" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <path d="M700 135 Q 742 135 756 196" fill="none" stroke="#2F7D5C" stroke-width="2.5" marker-end="url(#pr)"/>

  <line x1="560" y1="175" x2="688" y2="175" stroke="#17495B" stroke-width="2"/>
  <circle cx="590" cy="175" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="644" cy="175" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <path d="M688 175 Q 736 175 754 196" fill="none" stroke="#2F7D5C" stroke-width="2.5" marker-end="url(#pr)"/>

  <line x1="560" y1="243" x2="694" y2="243" stroke="#17495B" stroke-width="2"/>
  <circle cx="588" cy="243" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <circle cx="642" cy="243" r="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <path d="M694 243 Q 740 243 754 224" fill="none" stroke="#2F7D5C" stroke-width="2.5" marker-end="url(#pr)"/>

  <circle cx="768" cy="209" r="9" fill="#17495B"/>
  <rect x="796" y="194" width="58" height="30" rx="5" fill="#E39B2D"/>
  <text x="825" y="214" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4A4A4A">v2</text>
  <text x="884" y="214" font-size="13" fill="#4A4A4A">v3, v4…</text>

  <!-- ===== LAS CUATRO REGLAS ===== -->
  <rect x="36" y="300" width="218" height="130" rx="8" fill="#fff" stroke="#B4402F" stroke-width="2"/>
  <text x="56" y="326" font-size="13" font-weight="600" fill="#B4402F">1 · NADIE toca main</text>
  <text x="56" y="350" font-size="11.5" fill="#4A4A4A">Ni un commit directo.</text>
  <text x="56" y="370" font-size="11.5" fill="#4A4A4A">Si usted esta en main,</text>
  <text x="56" y="390" font-size="11.5" fill="#4A4A4A">esta leyendo, no</text>
  <text x="56" y="410" font-size="11.5" fill="#4A4A4A">escribiendo.</text>

  <rect x="266" y="300" width="218" height="130" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="286" y="326" font-size="13" font-weight="600" fill="#17495B">2 · Una rama por quien</text>
  <text x="286" y="350" font-size="11.5" fill="#4A4A4A">Con su nombre real, y</text>
  <text x="286" y="370" font-size="11.5" fill="#4A4A4A">una nueva por version.</text>
  <text x="286" y="390" font-size="11.5" fill="#4A4A4A">Ramas cortas: es lo que</text>
  <text x="286" y="410" font-size="11.5" fill="#4A4A4A">evita los conflictos.</text>

  <rect x="496" y="300" width="218" height="130" rx="8" fill="#fff" stroke="#2F7D5C" stroke-width="2"/>
  <text x="516" y="326" font-size="13" font-weight="600" fill="#2F7D5C">3 · Todo entra por PR</text>
  <text x="516" y="350" font-size="11.5" fill="#4A4A4A">El autor lo abre; el</text>
  <text x="516" y="370" font-size="11.5" fill="#4A4A4A">integrador revisa y es</text>
  <text x="516" y="390" font-size="11.5" fill="#4A4A4A">el UNICO que fusiona.</text>
  <text x="516" y="410" font-size="11.5" fill="#4A4A4A">Queda escrito quien reviso.</text>

  <rect x="726" y="300" width="218" height="130" rx="8" fill="#fff" stroke="#E39B2D" stroke-width="2.5"/>
  <text x="746" y="326" font-size="13" font-weight="600" fill="#4A4A4A">4 · Un tag por version</text>
  <text x="746" y="350" font-size="11.5" fill="#4A4A4A">Lo pone el integrador</text>
  <text x="746" y="370" font-size="11.5" fill="#4A4A4A">CUANDO los criterios</text>
  <text x="746" y="390" font-size="11.5" fill="#4A4A4A">pasan. Un tag antes es</text>
  <text x="746" y="410" font-size="11.5" fill="#4A4A4A">una firma en falso.</text>

  <!-- ===== CIERRE ===== -->
  <rect x="36" y="450" width="908" height="82" rx="8" fill="#17495B"/>
  <text x="60" y="480" font-size="14.5" font-weight="600" fill="#fff">El grafo ES la evidencia de la sustentacion.</text>
  <text x="60" y="506" font-size="13" fill="#F4F2EC">Tres lineas que entran a main es lo que el profesor abre para ver quien hizo que.</text>
  <text x="60" y="524" font-size="12.5" fill="#E39B2D">Una rama sin commits — o con uno gigante la noche anterior — es una sustentacion sin respaldo.</text>
</svg>
