<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 586" width="980" height="586" font-family="Segoe UI, system-ui, sans-serif">
  <title>El viaje de un clic, de punta a punta</title>
  <desc>De oprimir Emitir la factura hasta el disparador que comprueba el stock, y de vuelta. La regla mas importante del sistema no esta en C#: esta tres niveles abajo del boton.</desc>
  <defs>
    <marker id="v1" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#17495B"/>
    </marker>
    <marker id="v2" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#B4402F"/>
    </marker>
  </defs>
  <rect width="980" height="586" fill="#F4F2EC"/>

  <text x="36" y="42" font-size="21" font-weight="600" fill="#17495B">El viaje de un clic — «Emitir la factura»</text>
  <text x="36" y="66" font-size="14" fill="#4A4A4A">Ocho pasos, tres niveles. Y el que casi nadie espera es el 7.</text>

  <!-- paso 1 -->
  <rect x="36" y="94" width="196" height="58" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="50" y="116" font-size="11" font-weight="600" fill="#E39B2D">1 · NAVEGADOR</text>
  <text x="50" y="136" font-size="11.5" fill="#4A4A4A">el clic viaja por el circuito</text>
  <line x1="232" y1="123" x2="266" y2="123" stroke="#17495B" stroke-width="2" marker-end="url(#v1)"/>

  <!-- paso 2 -->
  <rect x="272" y="94" width="196" height="58" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="286" y="116" font-size="11" font-weight="600" fill="#E39B2D">2 · FRONT</text>
  <text x="286" y="136" font-size="11.5" fill="#4A4A4A">UN POST: maestro y detalle</text>
  <line x1="468" y1="123" x2="502" y2="123" stroke="#17495B" stroke-width="2" marker-end="url(#v1)"/>

  <!-- paso 3 -->
  <rect x="508" y="94" width="224" height="58" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="522" y="116" font-size="11" font-weight="600" fill="#E39B2D">3 · API · CONTROLADOR</text>
  <text x="522" y="136" font-size="11.5" fill="#4A4A4A">valida la FORMA. ¿falta algo? 422</text>

  <!-- salida temprana 422 -->
  <rect x="760" y="94" width="184" height="58" rx="8" fill="#fff" stroke="#B4402F" stroke-width="2"/>
  <text x="774" y="116" font-size="11" font-weight="600" fill="#B4402F">SALIDA TEMPRANA</text>
  <text x="774" y="136" font-size="11.5" fill="#4A4A4A">422 — no llega al servicio</text>
  <line x1="732" y1="123" x2="754" y2="123" stroke="#B4402F" stroke-width="2" marker-end="url(#v2)"/>

  <line x1="620" y1="152" x2="620" y2="182" stroke="#17495B" stroke-width="2" marker-end="url(#v1)"/>

  <!-- paso 4 -->
  <rect x="508" y="188" width="224" height="58" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="522" y="210" font-size="11" font-weight="600" fill="#E39B2D">4 · API · SERVICIO</text>
  <text x="522" y="230" font-size="11.5" fill="#4A4A4A">las reglas. NO sabe que es un 404</text>
  <line x1="620" y1="246" x2="620" y2="276" stroke="#17495B" stroke-width="2" marker-end="url(#v1)"/>

  <!-- paso 5 -->
  <rect x="508" y="282" width="224" height="58" rx="8" fill="#fff" stroke="#17495B" stroke-width="2"/>
  <text x="522" y="304" font-size="11" font-weight="600" fill="#E39B2D">5 · API · REPOSITORIO</text>
  <text x="522" y="324" font-size="11.5" fill="#4A4A4A">llama al PROCEDIMIENTO</text>
  <line x1="620" y1="340" x2="620" y2="370" stroke="#17495B" stroke-width="2" marker-end="url(#v1)"/>

  <!-- paso 6 -->
  <rect x="440" y="376" width="360" height="58" rx="8" fill="#fff" stroke="#2F7D5C" stroke-width="2.5"/>
  <text x="456" y="398" font-size="11" font-weight="600" fill="#2F7D5C">6 · BASE · PROCEDIMIENTO</text>
  <text x="456" y="418" font-size="11.5" fill="#4A4A4A">abre UNA TRANSACCION: el encabezado y los renglones</text>
  <line x1="620" y1="434" x2="620" y2="464" stroke="#2F7D5C" stroke-width="2" marker-end="url(#v1)"/>

  <!-- paso 7 · el importante -->
  <rect x="300" y="470" width="644" height="66" rx="8" fill="#fff" stroke="#2F7D5C" stroke-width="3"/>
  <text x="318" y="494" font-size="12" font-weight="600" fill="#2F7D5C">7 · BASE · DISPARADOR  —  el que casi nadie espera</text>
  <text x="318" y="514" font-size="11.5" fill="#4A4A4A">comprueba el stock  ·  calcula el subtotal  ·  baja el stock  ·  recalcula el total</text>
  <text x="318" y="530" font-size="11" font-style="italic" fill="#2F7D5C">«no se vende lo que no hay» NO esta en C#: esta aqui, tres niveles abajo del boton</text>

  <!-- paso 8 · la vuelta -->
  <rect x="36" y="188" width="392" height="246" rx="10" fill="none" stroke="#B4402F" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="56" y="214" font-size="12.5" font-weight="600" fill="#B4402F">8 · Y SI EL DISPARADOR RECHAZA</text>
  <text x="56" y="238" font-size="11.5" fill="#4A4A4A">La transaccion ENTERA se deshace. No queda</text>
  <text x="56" y="256" font-size="11.5" fill="#4A4A4A">media factura: ni el encabezado, ni los renglones</text>
  <text x="56" y="274" font-size="11.5" fill="#4A4A4A">que SI alcanzaron a entrar.</text>

  <rect x="56" y="290" width="354" height="54" rx="6" fill="#F4F2EC" stroke="#B4402F" stroke-width="1.5"/>
  <text x="68" y="311" font-size="10" font-family="Consolas, monospace" fill="#B4402F">500 · «Stock insuficiente para producto PR005.</text>
  <text x="68" y="330" font-size="10" font-family="Consolas, monospace" fill="#B4402F">Stock disponible: 14, cantidad solicitada: 99»</text>

  <text x="56" y="366" font-size="11.5" font-weight="600" fill="#4A4A4A">LA PRUEBA QUE LO DEMUESTRA:</text>
  <text x="56" y="386" font-size="11.5" fill="#4A4A4A">pida TRES productos donde el SEGUNDO no alcance.</text>
  <text x="56" y="404" font-size="11.5" fill="#4A4A4A">Si queda una factura con un renglon, la transaccion</text>
  <text x="56" y="422" font-size="11.5" fill="#4A4A4A">no existe — aunque el codigo diga BEGIN TRANSACTION.</text>

  <path d="M 296 503 Q 232 503 232 446" fill="none" stroke="#B4402F" stroke-width="2.5" marker-end="url(#v2)"/>
</svg>
